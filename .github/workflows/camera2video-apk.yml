name: Camera2Video APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Camera2Video/**'
      - '.github/workflows/camera2video-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Camera2Video/**'
      - '.github/workflows/camera2video-apk.yml'

jobs:
  build-apk:
    name: Build Android 16 compatible APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up 64-bit JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          architecture: x64
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: Camera2Video
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera2Video-debug-apk
          path: Camera2Video/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
